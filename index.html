<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏏 MatchStream - Free</title>
    <style>
        :root{--bg:#0a0a0f;--surface:#13132b;--surface2:#1a1a3e;--accent:#e94560;--gold:#f0c040;--text:#eee;--text2:#999;--success:#2ecc71;--warning:#f39c12;--danger:#e74c3c;--border:#2a2a4a}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
        .auth-overlay{position:fixed;inset:0;background:radial-gradient(ellipse at center,#1a1a3e 0%,#0a0a0f 70%);display:flex;align-items:center;justify-content:center;z-index:1000}
        .auth-overlay.hidden{display:none}
        .auth-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:2rem;width:90%;max-width:380px;box-shadow:0 10px 40px rgba(0,0,0,0.5);text-align:center}
        .auth-box .logo{font-size:3rem;margin-bottom:.5rem}
        .auth-box h2{font-size:1.3rem;margin-bottom:1.2rem;background:linear-gradient(135deg,#e94560,#f0c040);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .auth-box input{width:100%;padding:.7rem;margin-bottom:.7rem;border:2px solid var(--border);border-radius:8px;background:var(--surface2);color:var(--text);font-size:.95rem;outline:none}
        .btn{width:100%;padding:.7rem;border:none;border-radius:8px;font-size:1rem;font-weight:700;cursor:pointer}
        .btn-primary{background:var(--accent);color:#fff}
        .error-msg{color:var(--danger);font-size:.8rem;min-height:18px;margin-top:.4rem}
        .app{display:none;flex-direction:column;min-height:100vh}
        .app.active{display:flex}
        .header{background:var(--surface);border-bottom:1px solid var(--border);padding:.6rem .8rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.4rem;position:sticky;top:0;z-index:100}
        .logo-text{font-size:1.1rem;font-weight:800;color:var(--gold)}
        .role-badge{padding:.2rem .5rem;border-radius:15px;font-size:.6rem;font-weight:700}
        .role-superadmin{background:rgba(240,192,64,0.2);color:var(--gold);border:1px solid var(--gold)}
        .role-normal{background:rgba(46,204,113,0.2);color:var(--success);border:1px solid var(--success)}
        .header-actions{display:flex;gap:.2rem;flex-wrap:wrap;align-items:center}
        .btn-sm{padding:.3rem .6rem;border-radius:15px;font-size:.68rem;border:1px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer;font-weight:600}
        .btn-sm:hover{background:#1a1a4e}
        .btn-sm.active-rec{background:var(--danger);border-color:var(--danger);animation:recPulse 1s infinite;color:#fff}
        @keyframes recPulse{0%,100%{box-shadow:0 0 0 0 rgba(231,76,60,0.6)}50%{box-shadow:0 0 0 8px rgba(231,76,60,0)}}
        .btn-refresh{background:var(--success);border-color:var(--success);color:#fff}
        .main-content{display:flex;flex:1;gap:.8rem;padding:.8rem;flex-wrap:wrap}
        .video-panel{flex:1 1 65%;min-width:300px;background:var(--surface);border-radius:12px;border:1px solid var(--border);overflow:hidden;display:flex;flex-direction:column}
        .video-container{position:relative;background:#000;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;overflow:hidden}
        video{width:100%;height:100%;object-fit:contain}
        .video-placeholder{color:#555;text-align:center;position:absolute;font-size:.9rem}
        .video-controls-bar{display:flex;gap:.4rem;padding:.5rem .8rem;background:var(--surface2);flex-wrap:wrap;align-items:center}
        .btn-icon{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:.35rem .6rem;border-radius:5px;cursor:pointer;font-size:.75rem}
        .btn-icon:disabled{opacity:.4;pointer-events:none}
        .rec-timer{font-family:monospace;font-size:.85rem;font-weight:700;color:var(--danger);margin-left:auto;display:none;align-items:center;gap:.2rem}
        .rec-timer.visible{display:flex}
        .rec-dot{width:7px;height:7px;background:var(--danger);border-radius:50%;animation:pulse .8s infinite}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
        .upload-status{font-size:.6rem;color:var(--warning);margin:0 .4rem;display:none}
        .upload-status.visible{display:block}
        .sidebar{flex:1 1 30%;min-width:260px;background:var(--surface);border-radius:12px;border:1px solid var(--border);padding:.8rem;display:flex;flex-direction:column;max-height:calc(100vh - 110px)}
        .sidebar h3{font-size:.9rem;margin-bottom:.5rem;color:var(--gold);display:flex;justify-content:space-between}
        .search-box{width:100%;padding:.4rem .7rem;border-radius:15px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:.8rem;margin-bottom:.6rem;outline:none}
        .recordings-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:.4rem}
        .recording-item{background:var(--surface2);border-radius:8px;padding:.6rem;display:flex;justify-content:space-between;align-items:center;gap:.4rem;flex-wrap:wrap;border:1px solid transparent}
        .recording-item:hover{border-color:var(--accent)}
        .recording-info{flex:1;min-width:90px}
        .recording-info .rec-name{font-weight:600;font-size:.75rem;word-break:break-all}
        .recording-info .rec-meta{font-size:.6rem;color:var(--text2)}
        .recording-info .expiry{font-size:.6rem;color:var(--warning)}
        .rec-actions{display:flex;gap:.2rem}
        .btn-play{background:var(--accent);color:#fff;border:none;padding:.3rem .5rem;border-radius:5px;cursor:pointer;font-size:.65rem}
        .btn-delete-rec{background:transparent;border:1px solid var(--danger);color:var(--danger);padding:.25rem .4rem;border-radius:5px;cursor:pointer;font-size:.6rem}
        .comments-section{margin-top:.6rem;border-top:1px solid var(--border);padding-top:.6rem}
        .comments-section h4{font-size:.8rem;margin-bottom:.4rem}
        .comments-list{max-height:100px;overflow-y:auto;margin-bottom:.4rem;display:flex;flex-direction:column;gap:.2rem}
        .comment-item{background:var(--surface2);border-radius:5px;padding:.25rem .4rem;font-size:.65rem;display:flex;gap:.2rem;align-items:center}
        .comment-item .comment-user{font-weight:700;color:var(--gold);white-space:nowrap}
        .comment-item .comment-text{color:var(--text2);flex:1}
        .comment-item .comment-time{font-size:.5rem;color:#555}
        .comment-delete-btn{background:transparent;border:none;color:var(--danger);cursor:pointer;font-size:.6rem;opacity:0}
        .comment-item:hover .comment-delete-btn{opacity:1}
        .comment-input-row{display:flex;gap:.2rem}
        .comment-input-row input{flex:1;padding:.35rem .5rem;border-radius:15px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:.7rem;outline:none}
        .comment-input-row button{background:var(--accent);color:#fff;border:none;padding:.35rem .7rem;border-radius:15px;cursor:pointer;font-size:.7rem}
        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.9);display:none;align-items:center;justify-content:center;z-index:999}
        .modal-overlay.active{display:flex}
        .modal{background:var(--surface);border-radius:12px;padding:.8rem;width:90%;max-width:750px;border:1px solid var(--border)}
        .modal video{width:100%;max-height:65vh;border-radius:8px}
        .modal-close{float:right;background:var(--danger);border:none;color:#fff;width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:.9rem}
        .toast{position:fixed;bottom:12px;right:12px;background:var(--surface);border:1px solid var(--border);padding:.5rem .8rem;border-radius:8px;z-index:9999;animation:slideIn .3s;font-size:.75rem;max-width:280px}
        @keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
        .confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:9999}
        .confirm-overlay.active{display:flex}
        .confirm-box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.2rem;text-align:center;max-width:320px;width:90%}
        .confirm-box p{margin-bottom:.8rem;font-size:.9rem}
        .confirm-box .btn-row{display:flex;gap:.4rem;justify-content:center}
        .confirm-box .btn-yes{background:var(--danger);color:#fff;border:none;padding:.4rem 1rem;border-radius:6px;cursor:pointer}
        .confirm-box .btn-no{background:var(--surface2);color:var(--text);border:1px solid var(--border);padding:.4rem 1rem;border-radius:6px;cursor:pointer}
        @media(max-width:768px){.main-content{flex-direction:column}.video-panel,.sidebar{flex:1 1 100%;min-width:100%}.sidebar{max-height:none}}
    </style>
</head>
<body>
    <div class="auth-overlay" id="authOverlay">
        <div class="auth-box">
            <div class="logo">🏏</div>
            <h2>MatchStream Free</h2>
            <input type="text" id="usernameInput" placeholder="Username" autocomplete="off">
            <input type="password" id="passwordInput" placeholder="Password">
            <button class="btn btn-primary" id="authBtn">🔐 Login</button>
            <p class="error-msg" id="authError"></p>
            <p style="color:var(--text2);font-size:.6rem;margin-top:.4rem;">admin / admin123</p>
        </div>
    </div>
    <div class="app" id="app">
        <header class="header">
            <div style="display:flex;align-items:center;gap:.6rem;"><span class="logo-text">🏏 MatchStream</span><span class="role-badge" id="roleBadge">USER</span></div>
            <div class="header-actions">
                <button class="btn-sm btn-refresh" id="btnRefresh">🔄</button>
                <button class="btn-sm" id="btnRotate">📱</button>
                <button class="btn-sm" id="btnFullscreen">⛶</button>
                <button class="btn-sm" id="btnStartStream">▶️</button>
                <button class="btn-sm" id="btnStopStream" disabled>⏹️</button>
                <button class="btn-sm" id="btnRecord" disabled>🔴</button>
                <button class="btn-sm" id="btnDeleteAll" style="display:none">🗑</button>
                <button class="btn-sm" id="btnLogout" style="background:transparent;border-color:var(--danger);color:var(--danger)">🚪</button>
            </div>
        </header>
        <div class="main-content">
            <div class="video-panel">
                <div class="video-container" id="videoContainer">
                    <video id="livePreview" autoplay muted playsinline></video>
                    <div class="video-placeholder" id="videoPlaceholder">📷 Click ▶️</div>
                </div>
                <div class="video-controls-bar">
                    <button class="btn-icon" id="btnMic">🎤</button>
                    <span class="upload-status" id="uploadStatus"></span>
                    <div class="rec-timer" id="recTimer"><span class="rec-dot"></span><span id="timerText">00:00</span></div>
                </div>
            </div>
            <div class="sidebar">
                <h3>📁 Recordings <span style="font-size:.6rem;color:var(--text2)" id="recCount">0</span></h3>
                <input type="text" class="search-box" id="searchInput" placeholder="🔍 Search...">
                <div class="recordings-list" id="recordingsList"><div style="color:var(--text2);text-align:center;padding:1rem">Loading...</div></div>
                <div class="comments-section">
                    <h4>💬 Comments <span style="font-size:.55rem" id="commentCount">(0)</span></h4>
                    <div class="comments-list" id="commentsList"><div style="color:var(--text2);font-size:.65rem">No comments</div></div>
                    <div class="comment-input-row"><input type="text" id="commentInput" placeholder="Comment..." maxlength="200"><button id="sendComment">Send</button></div>
                </div>
            </div>
        </div>
    </div>
    <div class="modal-overlay" id="playbackModal"><div class="modal"><button class="modal-close" id="closeModal">✕</button><video id="playbackVideo" controls autoplay></video></div></div>
    <div class="confirm-overlay" id="confirmOverlay"><div class="confirm-box"><p id="confirmMsg">Sure?</p><div class="btn-row"><button class="btn-no" id="confirmNo">No</button><button class="btn-yes" id="confirmYes">Yes</button></div></div></div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDJeNJefhFRYwSiilYmYVHgU3_loOZkbK0",
            authDomain: "matchstream-pro.firebaseapp.com",
            projectId: "matchstream-pro",
            storageBucket: "matchstream-pro.firebasestorage.app",
            messagingSenderId: "35855908306",
            appId: "1:35855908306:web:18391881b7f957dcc25c0b"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        console.log('✅ Free Mode (Firestore Only)');

        const USERS_KEY = 'ms_users_v1';
        const EXPIRY_DAYS = 7;
        const CHUNK_SIZE = 800000;
        const DEFAULT_USERS = [{ username: 'admin', password: 'admin123', role: 'superadmin' }];

        let mediaStream = null, mediaRecorder = null, recordedChunks = [];
        let isRecording = false, recordingStartTime = null, timerInterval = null;
        let isMicOn = true, currentRotation = 0;
        let currentUser = null, pendingAction = null, refreshInterval = null;

        function getUsers() {
            let u = JSON.parse(localStorage.getItem(USERS_KEY)) || [];
            if(!u.length){u=DEFAULT_USERS;localStorage.setItem(USERS_KEY,JSON.stringify(u));}
            return u;
        }
        function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2000);}

        function splitBase64(b64,size){const c=[];for(let i=0;i<b64.length;i+=size)c.push(b64.substring(i,i+size));return c;}

        async function saveRecording(blob) {
            if(!currentUser) return;
            const meta = {
                id: Date.now().toString(36)+Math.random().toString(36).substr(2,8),
                name: `M${new Date().toLocaleDateString('en-IN').replace(/\//g,'')}_${new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}`,
                timestamp: Date.now(),
                size: blob.size,
                duration: recordingStartTime?Math.round((Date.now()-recordingStartTime)/1000):0,
                uploadedBy: currentUser.username,
                totalChunks: 0
            };

            const status = document.getElementById('uploadStatus');
            status.classList.add('visible');
            status.textContent = '⏳ Processing...';
            toast('📤 Compressing & uploading...');

            const reader = new FileReader();
            reader.onload = async () => {
                try {
                    const base64 = reader.result;
                    const chunks = splitBase64(base64, CHUNK_SIZE);
                    meta.totalChunks = chunks.length;

                    await db.collection('recordings').doc(meta.id).set({
                        ...meta,
                        expiry: Date.now() + EXPIRY_DAYS * 86400000
                    });

                    for(let i=0;i<chunks.length;i++) {
                        status.textContent = `⏳ ${Math.round((i+1)/chunks.length*100)}%`;
                        await db.collection('recordings').doc(meta.id).collection('c').doc('c'+i).set({
                            i: i, d: chunks[i]
                        });
                    }

                    status.classList.remove('visible');
                    toast(`✅ Done! ${chunks.length} parts`);
                    loadRecordings();
                } catch(e) {
                    status.classList.remove('visible');
                    toast('❌ ' + (e.message||'Error'));
                }
            };
            reader.onerror = () => { status.classList.remove('visible'); toast('❌ Read error'); };
            reader.readAsDataURL(blob);
        }

        async function loadRecordings() {
            if(!db) return;
            try {
                const snap = await db.collection('recordings').orderBy('timestamp','desc').limit(15).get();
                const recs = [];
                snap.forEach(doc => recs.push({id:doc.id,...doc.data()}));
                
                const now = Date.now();
                const active = recs.filter(r => r.expiry > now);
                const filter = document.getElementById('searchInput').value.toLowerCase();
                const filtered = filter ? active.filter(r => r.name.toLowerCase().includes(filter)) : active;
                
                document.getElementById('recCount').textContent = filtered.length;
                document.getElementById('recordingsList').innerHTML = filtered.length ? filtered.map(r => {
                    const canDel = currentUser && (currentUser.role==='superadmin'||r.uploadedBy===currentUser.username);
                    return `<div class="recording-item"><div class="recording-info">
                        <div class="rec-name">🎬 ${r.name} ${r.totalChunks>1?'('+r.totalChunks+')':''}</div>
                        <div class="rec-meta">📅 ${new Date(r.timestamp).toLocaleString('en-IN')} • ⏱ ${String(Math.floor((r.duration||0)/60)).padStart(2,'0')}:${String((r.duration||0)%60).padStart(2,'0')} • 📦${(r.size/1024/1024).toFixed(1)}MB</div>
                        <div class="expiry">🗑 ${new Date(r.expiry).toLocaleDateString('en-IN',{day:'2-digit',month:'short'})}</div>
                    </div><div class="rec-actions">
                        <button class="btn-play" onclick="playR('${r.id}')">▶</button>
                        ${canDel?`<button class="btn-delete-rec" onclick="delR('${r.id}')">🗑</button>`:''}
                    </div></div>`;
                }).join('') : '<div style="color:var(--text2);text-align:center;padding:1rem">No videos<br><small>🔄 Refresh</small></div>';
            } catch(e) { console.error(e); }
        }

        window.playR = async function(id) {
            try {
                const doc = await db.collection('recordings').doc(id).get();
                if(!doc.exists){toast('❌ Not found');return;}
                const meta = doc.data();
                toast('⏳ Loading...');
                const cs = await db.collection('recordings').doc(id).collection('c').orderBy('i').get();
                let full = '';
                cs.forEach(c => full += c.data().d);
                document.getElementById('playbackVideo').src = full;
                document.getElementById('playbackModal').classList.add('active');
            } catch(e) { toast('❌ Play error'); }
        };

        window.delR = async function(id) {
            document.getElementById('confirmMsg').textContent = 'Delete?';
            pendingAction = async () => {
                const cs = await db.collection('recordings').doc(id).collection('c').get();
                cs.forEach(c => c.ref.delete());
                await db.collection('recordings').doc(id).delete();
                loadRecordings(); toast('🗑 Deleted');
            };
            document.getElementById('confirmOverlay').classList.add('active');
        };

        async function startCam() {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    video: { width:{ideal:640}, height:{ideal:480}, facingMode:'environment' },
                    audio: true
                });
                document.getElementById('livePreview').srcObject = mediaStream;
                document.getElementById('livePreview').style.display='block';
                document.getElementById('videoPlaceholder').style.display='none';
                document.getElementById('btnStartStream').disabled=true;
                document.getElementById('btnStopStream').disabled=false;
                document.getElementById('btnRecord').disabled=false;
                toast('📹 Ready (640p)');
            } catch(e) { toast('❌ Camera denied'); }
        }

        function stopCam() {
            if(mediaStream){mediaStream.getTracks().forEach(t=>t.stop());mediaStream=null;}
            document.getElementById('livePreview').srcObject=null;
            document.getElementById('livePreview').style.display='none';
            document.getElementById('videoPlaceholder').style.display='block';
            document.getElementById('btnStartStream').disabled=false;
            document.getElementById('btnStopStream').disabled=true;
            document.getElementById('btnRecord').disabled=true;
            stopRec(true);
        }

        function startRec() {
            if(!mediaStream) return;
            recordedChunks=[];
            try {
                mediaRecorder = new MediaRecorder(mediaStream, {
                    mimeType: 'video/webm;codecs=vp8',
                    videoBitsPerSecond: 300000 // 300kbps compression
                });
            } catch(e) {
                mediaRecorder = new MediaRecorder(mediaStream, { mimeType: 'video/webm' });
            }
            mediaRecorder.ondataavailable = e => { if(e.data.size) recordedChunks.push(e.data); };
            mediaRecorder.onstop = () => {
                if(recordedChunks.length) saveRecording(new Blob(recordedChunks, {type:'video/webm'}));
                recordedChunks=[];
            };
            mediaRecorder.start(15000);
            isRecording=true; recordingStartTime=Date.now();
            document.getElementById('btnRecord').textContent='⏹️';
            document.getElementById('btnRecord').classList.add('active-rec');
            document.getElementById('recTimer').classList.add('visible');
            startTimer();
            toast('🔴 Recording (compressed)');
        }

        function stopRec(silent) {
            if(!isRecording) return;
            mediaRecorder.stop();
            isRecording=false; recordingStartTime=null;
            document.getElementById('btnRecord').textContent='🔴';
            document.getElementById('btnRecord').classList.remove('active-rec');
            document.getElementById('recTimer').classList.remove('visible');
            stopTimer();
            if(!silent) toast('⏹️ Saving...');
        }

        function startTimer(){stopTimer();timerInterval=setInterval(()=>{if(!recordingStartTime)return;const e=Math.floor((Date.now()-recordingStartTime)/1000);document.getElementById('timerText').textContent=String(Math.floor(e/60)).padStart(2,'0')+':'+String(e%60).padStart(2,'0');},1000);}
        function stopTimer(){clearInterval(timerInterval);timerInterval=null;document.getElementById('timerText').textContent='00:00';}

        function login() {
            const u=document.getElementById('usernameInput').value.trim();
            const p=document.getElementById('passwordInput').value.trim();
            if(!u||!p){document.getElementById('authError').textContent='Fill fields';return;}
            const user=getUsers().find(x=>x.username===u&&x.password===p);
            if(user) {
                sessionStorage.setItem('ms_auth',JSON.stringify({username:user.username,role:user.role}));
                document.getElementById('authOverlay').classList.add('hidden');
                document.getElementById('app').classList.add('active');
                currentUser={username:user.username,role:user.role};
                const isSA=user.role==='superadmin';
                document.getElementById('roleBadge').textContent=isSA?'👑 ADMIN':'👤 USER';
                document.getElementById('roleBadge').className='role-badge '+(isSA?'role-superadmin':'role-normal');
                document.getElementById('btnDeleteAll').style.display=isSA?'inline-block':'none';
                loadRecordings();startCam();
                if(refreshInterval)clearInterval(refreshInterval);
                refreshInterval=setInterval(()=>loadRecordings(),15000);
                toast('✅ Free mode! Compressed upload');
            } else { document.getElementById('authError').textContent='❌ Invalid!'; }
        }

        function logout() {
            stopRec(true);stopCam();
            if(refreshInterval)clearInterval(refreshInterval);
            sessionStorage.removeItem('ms_auth');currentUser=null;
            document.getElementById('authOverlay').classList.remove('hidden');
            document.getElementById('app').classList.remove('active');
        }

        document.getElementById('authBtn').addEventListener('click',login);
        document.getElementById('passwordInput').addEventListener('keydown',e=>e.key==='Enter'&&login());
        document.getElementById('btnStartStream').addEventListener('click',startCam);
        document.getElementById('btnStopStream').addEventListener('click',stopCam);
        document.getElementById('btnRecord').addEventListener('click',()=>isRecording?stopRec():startRec());
        document.getElementById('btnRefresh').addEventListener('click',()=>loadRecordings());
        document.getElementById('btnRotate').addEventListener('click',()=>{currentRotation=(currentRotation+90)%360;const vc=document.getElementById('videoContainer');vc.style.transform=`rotate(${currentRotation}deg)`;vc.style.aspectRatio=(currentRotation===90||currentRotation===270)?'9/16':'16/9';});
        document.getElementById('btnFullscreen').addEventListener('click',()=>{const vc=document.getElementById('videoContainer');document.fullscreenElement?document.exitFullscreen():vc.requestFullscreen().catch(()=>{});});
        document.getElementById('btnMic').addEventListener('click',()=>{if(!mediaStream)return;isMicOn=!isMicOn;mediaStream.getAudioTracks().forEach(t=>t.enabled=isMicOn);document.getElementById('btnMic').textContent=isMicOn?'🎤':'🔇';});
        document.getElementById('btnDeleteAll').addEventListener('click',async()=>{if(currentUser.role!=='superadmin')return;document.getElementById('confirmMsg').textContent='Delete ALL?';pendingAction=async()=>{const s=await db.collection('recordings').get();for(const d of s.docs){const cs=await d.ref.collection('c').get();cs.forEach(c=>c.ref.delete());await d.ref.delete();}loadRecordings();toast('🗑 All deleted');};document.getElementById('confirmOverlay').classList.add('active');});
        document.getElementById('btnLogout').addEventListener('click',logout);
        document.getElementById('searchInput').addEventListener('input',()=>loadRecordings());
        document.getElementById('closeModal').addEventListener('click',()=>{const v=document.getElementById('playbackVideo');v.pause();v.src='';document.getElementById('playbackModal').classList.remove('active');});
        document.getElementById('confirmYes').addEventListener('click',()=>{if(pendingAction)pendingAction();document.getElementById('confirmOverlay').classList.remove('active');pendingAction=null;});
        document.getElementById('confirmNo').addEventListener('click',()=>{document.getElementById('confirmOverlay').classList.remove('active');pendingAction=null;});

        const saved=sessionStorage.getItem('ms_auth');
        if(saved){currentUser=JSON.parse(saved);document.getElementById('authOverlay').classList.add('hidden');document.getElementById('app').classList.add('active');const isSA=currentUser.role==='superadmin';document.getElementById('roleBadge').textContent=isSA?'👑 ADMIN':'👤 USER';document.getElementById('roleBadge').className='role-badge '+(isSA?'role-superadmin':'role-normal');document.getElementById('btnDeleteAll').style.display=isSA?'inline-block':'none';loadRecordings();startCam();if(refreshInterval)clearInterval(refreshInterval);refreshInterval=setInterval(()=>loadRecordings(),15000);}
    </script>
</body>
</html>
